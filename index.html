<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>One Button Too Many</title>
    <meta
      name="description"
      content="A short perception game: press the one real button, again and again, as the page makes that harder to tell."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">One Button Too Many</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">One Button Too Many</h1>
      <div id="stage" class="stage">
        <div id="end-screen" class="end-screen" aria-live="polite">
          <h2 id="end-title"></h2>
          <p id="end-stats"></p>
          <p class="hint">press anywhere to try again</p>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
